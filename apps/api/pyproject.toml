[project]
name = "marking-assistant-api"
version = "0.1.0"
description = "Marking Assistant API and workers"
requires-python = "==3.12.*"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "psycopg[binary]==3.2.3",
    "dramatiq[redis]==1.17.1",
    "redis==5.2.1",
    # spec.md §3 requires argon2id for password_hash, and Appendix A pins
    # JWT RS256. Neither is reachable with the standard library.
    "argon2-cffi==23.1.0",
    "pyjwt[crypto]==2.10.1",
    # Booklet generation and Engine 1 (spec.md §1.1, ENGINE 1).
    # opencv-*contrib* specifically: cv2.aruco lives in contrib, and both the
    # generator here and the detector in stage 3 need the same dictionary.
    "opencv-contrib-python-headless==4.10.0.84",
    "numpy==2.2.1",
    # 5.x rather than 4.x: 4.2.5 emits a DeprecationWarning on import under
    # Python 3.12 (ast.NameConstant), which `filterwarnings = ["error"]` turns
    # into a collection failure. Suppressing it would blunt a check that has
    # already caught a real connection leak.
    "reportlab==5.0.0",
    "qrcode[pil]==8.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
    "ruff==0.9.1",
    "mypy==1.14.1",
    # Test-only. PDF content streams are compressed, so asserting on generated
    # text needs a real reader rather than a byte search.
    "pypdf==5.1.0",
]

[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Scoped per module rather
# than set globally, so a genuinely untyped import elsewhere still fails.
module = ["dramatiq.*", "reportlab.*", "qrcode.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "integration: needs a real PostgreSQL; skipped when none is reachable",
]
